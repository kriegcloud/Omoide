name: omoide-workstation

services:
  omoide:
    image: "${OMOIDE_WORKSTATION_IMAGE:-omoide-workstation:0.7.0-local}"
    build:
      context: .
      dockerfile: Dockerfile.workstation
      args:
        OMOIDE_BASE_IMAGE: "${OMOIDE_IMAGE:-einaeffchen/omoide:0.7.0@sha256:b4d4cb096808dc14c99b381c35b35300196c92929309fbe10c7a29a23b23dae7}"
    container_name: omoide
    ports:
      - target: 8123
        published: "${PORT:-8123}"
        host_ip: 127.0.0.1
        protocol: tcp
    env_file:
      - path: "${ENV_FILE:?ENV_FILE must be set}"
        required: true
    environment:
      HOME: /app/data/.home
      OMOIDE_DUPLICATES__DUPLICATE_AUTO_HANDLING: keep
      OMOIDE_GENERAL__DOCKER_MEDIA_READ_ONLY: "false"
      OMOIDE_GENERAL__MEDIA_EXPORT_HOST_ROOT_T7: "${HOST_MEDIA_DIR_T7}"
      OMOIDE_GENERAL__MEDIA_EXPORT_HOST_ROOT_T7XFER: "${HOST_MEDIA_DIR_T7XFER}"
      OMOIDE_FACE_RECOGNITION__EMBEDDING_BACKEND: "${OMOIDE_FACE_BACKEND:-buffalo_l}"
      OMOIDE_FACE_RECOGNITION__INFERENCE_SOCKET_PATH: /app/data/run/omoide-ml.sock
      OMOIDE_GENERAL__UPDATE_CHECK_REPO: "null"
      OMOIDE_SCAN__AUTO_CLEAN_ON_SCAN: "false"
      OMOIDE_SCAN__AUTO_CLEANUP_WITHOUT_REVIEW: "false"
      OMOIDE_WORKSTATION_BROWSER_HARDENING: "true"
      PYTHONDONTWRITEBYTECODE: "1"
      TMPDIR: /tmp
      XDG_CACHE_HOME: /app/data/.cache
      XDG_CONFIG_HOME: /app/data/.config
    user: "1000:1000"
    privileged: false
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 2048
    stop_grace_period: 2m
    ulimits:
      core:
        soft: 0
        hard: 0
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=1g,mode=1777
    volumes:
      - type: bind
        source: "${HOST_MEDIA_DIR_T7:?HOST_MEDIA_DIR_T7 must be set}"
        target: /app/media/T7
        read_only: false
        bind:
          create_host_path: false
      - type: bind
        source: "${HOST_MEDIA_DIR_T7XFER:?HOST_MEDIA_DIR_T7XFER must be set}"
        target: /app/media/T7XFER
        read_only: false
        bind:
          create_host_path: false
      - type: bind
        source: "${HOST_DATA_DIR:?HOST_DATA_DIR must be set}"
        target: /app/data
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request;
          response = urllib.request.urlopen(
          'http://127.0.0.1:8123/api/version', timeout=5);
          payload = json.load(response); response.close();
          raise SystemExit(0 if payload.get('version') else 1)
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    restart: unless-stopped
